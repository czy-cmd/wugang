<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070508">
<title>雾港 6.0</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#070508;color:#d5cbc0;
 font-family:"Songti SC","SimSun",Georgia,serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#bg{position:absolute;inset:0;background:#070508;transition:background 1.2s}
#bg[data-mode="door"]{background:#070508 url('assets/red_door.png') center/cover no-repeat;opacity:.6}
#bg[data-mode="glitch"]{background:#070508 url('assets/glitch_bg.jpg') center/cover no-repeat;opacity:.55}
#fog{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;
 background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(90,10,10,.25) 100%)}
body.deep #fog{opacity:1}
#scan{position:absolute;inset:0;pointer-events:none;opacity:.12;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.5) 0 1px,transparent 1px 3px)}
#vign{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 60px #000}
body.extreme #vign{box-shadow:inset 0 0 260px 110px #000}
body.hell #vign{box-shadow:inset 0 0 220px 90px #000}
#noise{position:absolute;inset:0;pointer-events:none;opacity:.05;filter:contrast(140%)}
body.no-fx #noise,body.no-fx #scan{display:none}
.layer{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;z-index:5}
.layer.on{display:flex}
.panel{width:min(560px,100%);display:flex;flex-direction:column;gap:14px}
h1{font-size:40px;letter-spacing:14px;color:#efe6dc;font-weight:400;text-align:center;text-shadow:0 0 18px rgba(180,40,40,.35)}
h2{font-size:22px;letter-spacing:6px;color:#d8c8b8;font-weight:400;text-align:center;margin-bottom:6px}
.small{font-size:13px;color:#8d7f7f;letter-spacing:2px;text-align:center}
.lead{font-size:15px;color:#b9a89b;letter-spacing:2px;text-align:center;min-height:22px}
.stat{font-size:12px;color:#6d5f5f;letter-spacing:2px;text-align:center;min-height:18px}
.btn{display:block;width:100%;padding:15px;background:rgba(28,18,16,.72);border:1px solid rgba(150,80,70,.35);
 color:#e2d5c8;font-size:16px;letter-spacing:4px;font-family:inherit;cursor:pointer;text-align:center;
 transition:background .18s,border-color .18s,color .18s}
.btn:hover{background:rgba(50,28,24,.85);border-color:rgba(190,60,50,.7);color:#fff}
.btn:active{transform:scale(.985)}
.btn.gray{border-color:rgba(110,100,95,.3);color:#9b8b80}
.btn.sm{width:auto;padding:9px 22px;font-size:13px;letter-spacing:2px}
.btn.danger{border-color:rgba(160,50,50,.5);color:#c98a7a}
.btn.danger2{border-color:rgba(220,40,30,.7);color:#e8b0a0;background:rgba(40,12,10,.8)}
.btn:disabled{opacity:.35;cursor:not-allowed}
#menuFoot{position:absolute;bottom:18px;font-size:11px;color:#5a4e4e;letter-spacing:3px;cursor:pointer;z-index:6}
#menuFoot span:hover{color:#a88a7a}
/* 标题容器 */
.titleWrap{position:relative;display:inline-block}
/* MC 风格提示词：每 10 秒随机出现在一个地方，5 秒后消失 */
#splash{position:fixed;left:12%;top:20%;font-family:"SimSun",serif;font-size:14px;color:#FFFF55;
 text-shadow:2px 2px 0 #3F3F00;transform:rotate(-8deg);letter-spacing:1px;z-index:40;opacity:0;
 transition:opacity .6s, left .5s ease, top .5s ease;pointer-events:none;white-space:nowrap;max-width:70vw}
#splash.on{opacity:1}
/* 首玩「开始游戏」按钮飘散字：不固定，从按钮周围散出 */
.startWrap{position:relative}
.scatter{position:absolute;pointer-events:none;font-size:13px;color:#b08a7a;letter-spacing:2px;white-space:nowrap;
 text-shadow:0 0 6px rgba(180,60,50,.4);animation:scatterFloat 2.6s ease-out forwards;opacity:0;z-index:6}
@keyframes scatterFloat{
 0%{opacity:0;transform:translate(0,0) scale(.5)}
 14%{opacity:1;transform:translate(calc(var(--dx,0px)*.4),calc(var(--dy,0px)*.4)) scale(1)}
 100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(.72)}
}
/* 剧情 */
#storyBox{position:absolute;inset:0;display:flex;flex-direction:column;z-index:6;padding:34px 30px 30px}
#storyHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#depthTag{font-size:11px;letter-spacing:3px;color:#7a6a60;border:1px solid rgba(120,90,80,.4);padding:4px 10px;border-radius:2px}
#storyText{flex:1;overflow-y:auto;font-size:17px;line-height:2;letter-spacing:1px;color:#d5cbc0;
 -webkit-mask-image:linear-gradient(#000 96%,transparent)}
#storyText p{margin-bottom:14px}
#opts{display:flex;flex-direction:column;gap:10px;padding-top:14px}
.opt{display:block;width:100%;padding:14px;background:rgba(26,17,15,.7);border:1px solid rgba(150,80,70,.3);
 color:#d8c9bb;font-size:15px;letter-spacing:2px;font-family:inherit;cursor:pointer;text-align:left;
 transition:background .18s,border-color .18s}
.opt:hover{background:rgba(60,30,25,.85);border-color:rgba(200,70,55,.7);color:#fff}
.opt:active{transform:scale(.99)}
.cur{display:inline-block;width:2px;height:1.1em;background:#c8a;vertical-align:-2px;margin-left:2px;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.glit{color:#b34a3a;text-shadow:0 0 6px rgba(200,40,30,.6)}
/* 结局 */
#endNo{font-size:20px;letter-spacing:4px;color:#e6d6c6;text-align:center;margin-bottom:4px}
#endType{font-size:13px;letter-spacing:2px;text-align:center;margin-bottom:6px}
#endPath{font-size:13px;letter-spacing:2px;color:#c07868;text-align:center;line-height:1.9;margin-bottom:16px}
#endText{font-size:16px;line-height:2;letter-spacing:1px;color:#d5cbc0;text-align:center;min-height:60px}
#endHorror{font-size:12px;letter-spacing:2px;color:#9a6a5a;text-align:center;margin-top:6px}
#endAsk{font-size:14px;letter-spacing:2px;color:#c33;text-align:center;margin-top:14px;min-height:20px;text-shadow:0 0 8px rgba(200,0,0,.5)}
/* 图鉴 */
#gallery{overflow-y:auto;justify-content:flex-start;padding-top:40px}
/* 结局图鉴：9 类 tab + 隐藏 tab，块状格子 */
.galTabs{display:flex;gap:5px;width:min(560px,100%);flex-wrap:wrap}
.galTab{flex:1 1 60px;padding:8px 3px;border-radius:8px 8px 0 0;border:1px solid rgba(150,80,70,.3);border-bottom:none;
 background:rgba(24,16,14,.3);color:#7a6a6a;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:1px;transition:all .15s}
.galTab:hover{color:#b9a08a}
.galTab.active{color:#e0d2c2;border-color:rgba(190,70,60,.5);background:rgba(44,24,20,.5)}
#galGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(560px,100%)}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;
 background:rgba(24,16,14,.7);border:1px solid rgba(120,80,70,.3);color:#6d5f5f;font-size:12px;
 letter-spacing:1px;cursor:pointer;padding:4px;line-height:1.4;transition:all .18s;border-radius:6px}
.cell.open{color:#e0d2c2;border-color:rgba(190,70,60,.55);background:rgba(44,24,20,.7)}
.cell:hover{border-color:rgba(200,70,55,.7)}
.cell.hiddenE{border-color:rgba(150,20,20,.7);background:rgba(80,8,8,.55);color:#ff2a2a}
.cell.hiddenE:hover{border-color:#ff2a2a;background:rgba(120,10,10,.6)}
.scatter.doubt{color:#ff1a1a;text-shadow:0 0 8px rgba(255,0,0,.7);font-size:15px}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(6px,-6px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}
.lastChar{cursor:pointer;border-bottom:1px dashed rgba(200,70,55,.6)}
.lastChar:hover{color:#ff5a4a}
.secretHint{color:#8a7468;letter-spacing:2px}
.secretCur{display:inline-block;animation:blink 1s step-end infinite;color:#e8dccd;font-size:18px}
.doubtLine{color:#b08a7a;letter-spacing:1px;animation:dbIn .5s ease}
@keyframes dbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
/* 模态 */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:30px}
#modal.on{display:flex}
#modalBox{width:min(520px,100%);background:#120c0b;border:1px solid rgba(170,70,60,.45);padding:26px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto}
/* 暂停 */
#pause{position:absolute;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:15;flex-direction:column;gap:16px}
#pause.on{display:flex}
/* 设置 */
#setItems{width:min(520px,100%);display:flex;flex-direction:column;gap:4px}
.chk{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(120,90,80,.18);gap:12px}
.chk span{font-size:14px;letter-spacing:1px;color:#c4b5a6}
.chk input[type=checkbox]{width:18px;height:18px;accent-color:#b04a3a;cursor:pointer}
.chk select{background:#1a1210;color:#d5cbc0;border:1px solid rgba(150,80,70,.4);padding:6px 10px;font-family:inherit;font-size:13px;cursor:pointer}
#setBtns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.extWarn{font-size:12px;letter-spacing:1px;color:#c0392b;line-height:1.8;border:1px solid rgba(190,40,30,.4);padding:10px;background:rgba(40,10,8,.5)}
/* 极度恐怖：降级被阻难时面板躲避动画 */
#setLayer .panel{transition:transform .12s}
#setLayer .panel.dodge{transition:none}
/* 关于（标准格式） */
#aboutBox{width:min(520px,100%);text-align:left;font-size:14px;line-height:1.9;letter-spacing:1px;color:#bfae9e;overflow-y:auto;max-height:72vh}
#aboutBox .arow{display:flex;border-bottom:1px solid rgba(120,90,80,.18);padding:7px 2px}
#aboutBox .ak{flex:0 0 96px;color:#8d7a70;letter-spacing:2px}
#aboutBox .av{flex:1;color:#cfbdaa}
#aboutBox .sec{font-size:13px;letter-spacing:3px;color:#b98a78;margin:16px 0 4px;border-bottom:1px solid rgba(150,80,70,.3);padding-bottom:4px}
/* 首屏手写 */
#intro{position:absolute;inset:0;background:#070508;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;cursor:pointer;transition:opacity .6s}
#intro.off{opacity:0;pointer-events:none}
#intro .tip{position:absolute;bottom:38px;font-size:12px;color:#5e5252;letter-spacing:3px;animation:tb 1.8s ease-in-out infinite}
#intro .subtitle{font-size:15px;letter-spacing:4px;color:#b9a89b;margin-top:10px;opacity:0;transition:opacity .5s}
#intro .subtitle.on{opacity:1}
#logoText{transition:fill .8s ease}
@keyframes tb{0%,100%{opacity:.35}50%{opacity:1}}
#cross{position:fixed;inset:0;z-index:60;background:center/contain no-repeat;opacity:0;pointer-events:none}
#cross.on{animation:fl .24s}
@keyframes fl{0%{opacity:0}50%{opacity:.85}100%{opacity:0}}
/* 突脸（羽化边缘，与场景融合） */
#scare{position:fixed;inset:0;z-index:70;background:center/contain no-repeat #000;opacity:0;pointer-events:none;
 -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 40%,rgba(0,0,0,.55) 64%,transparent 86%);
 mask-image:radial-gradient(ellipse at 50% 50%,#000 40%,rgba(0,0,0,.55) 64%,transparent 86%)}
#scare::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse at 50% 55%,transparent 26%,rgba(40,8,6,.45) 74%,rgba(6,2,2,.92) 100%);mix-blend-mode:multiply}
#scare.on{animation:scare .5s}
@keyframes scare{0%{opacity:0;transform:scale(.6)}15%{opacity:.92;transform:scale(1.12)}35%{transform:scale(1)}100%{opacity:.92}}
.shake-hard{animation:shakeh .4s}
@keyframes shakeh{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,6px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-6px,-7px)}80%{transform:translate(5px,4px)}}
body.extreme #scan{opacity:.22}
body.hell #scan{opacity:.18}
/* 小游戏 */
#miniGame{position:absolute;inset:0;background:rgba(5,3,3,.92);display:none;align-items:center;justify-content:center;z-index:25;flex-direction:column;gap:18px;padding:30px}
#miniGame.on{display:flex}
#mgTitle{font-size:22px;letter-spacing:5px;color:#e0c8b8;text-align:center}
#mgHint{font-size:13px;letter-spacing:2px;color:#8a7468;text-align:center}
#mgBar{width:min(360px,80%);height:14px;background:rgba(40,24,20,.7);border:1px solid rgba(150,80,70,.4);position:relative;overflow:hidden}
#mgBarFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#6a1a14,#c0392b);transition:width .05s linear}
#mgBar .mgZone{position:absolute;top:0;bottom:0;background:rgba(220,120,60,.25);border-left:1px solid rgba(220,140,70,.6);border-right:1px solid rgba(220,140,70,.6)}
#mgBar .mgNeedle{position:absolute;top:-3px;bottom:-3px;width:3px;background:#efe6dc;box-shadow:0 0 6px rgba(240,230,220,.8)}
#mgArea{width:min(360px,86%);min-height:170px;border:1px solid rgba(150,80,70,.4);background:rgba(16,10,9,.6);
 display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;
 font-size:16px;letter-spacing:2px;color:#c8b4a4;line-height:1.8;position:relative;overflow:hidden;user-select:none}
#mgArea:active{background:rgba(40,22,18,.7)}
#mgTap{width:min(360px,80%);padding:16px;background:rgba(30,14,12,.8);border:1px solid rgba(190,70,55,.55);
 color:#e8d2c4;font-size:17px;letter-spacing:4px;font-family:inherit;cursor:pointer}
#mgTap:hover{background:rgba(60,22,18,.9)}
#mgTap:active{transform:scale(.98)}
.mgText{font-size:22px;letter-spacing:3px;color:#c0392b}
.mgCount{position:absolute;bottom:8px;right:12px;font-size:12px;color:#8a6a5a}
/* 小游戏：躲闪模式（多目标点） */
#mgBoard{position:relative;width:min(360px,86%);height:240px;border:1px solid rgba(150,80,70,.4);background:rgba(16,10,9,.6);overflow:hidden}
.mgDot{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(200,60,50,.85);border:1px solid #ff8a7a;box-shadow:0 0 12px rgba(200,40,30,.7);cursor:pointer}
.mgDot.safe{background:rgba(90,180,120,.85);border-color:#b8ffd0;box-shadow:0 0 12px rgba(80,180,110,.7)}
.mgDot.bad{background:rgba(60,60,70,.6);border-color:#666;box-shadow:none}
/* 小游戏：记忆翻牌 */
#mgCards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(360px,86%)}
.mgCard{aspect-ratio:1;background:rgba(40,24,20,.8);border:1px solid rgba(150,80,70,.4);border-radius:8px;cursor:pointer;
 display:flex;align-items:center;justify-content:center;font-size:22px;color:#e0c8b8;transition:all .15s}
.mgCard.flip{background:rgba(70,30,24,.9);border-color:#c85050;color:#ffb0a0}
.mgCard.off{opacity:.35}
/* 免责声明（markdown 渲染） */
#disclaimer{position:absolute;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:45;padding:30px}
#disclaimer.on{display:flex}
#discBox{width:min(560px,100%);background:#0f0a09;border:1px solid rgba(170,70,60,.5);padding:26px;display:flex;flex-direction:column;gap:14px;max-height:90vh}
#discBox .discScroll{overflow-y:auto;flex:1;font-size:14px;line-height:2;letter-spacing:1px;color:#cbb4a4;padding-right:8px;min-height:100px}
#extreme{position:absolute;inset:0;background:rgba(0,0,0,.95);display:none;flex-direction:column;z-index:46;padding:28px}
#extreme.on{display:flex}
#extTitle{font-size:20px;letter-spacing:5px;color:#e0a090;text-align:center;margin-bottom:14px}
#extScroll{flex:1;overflow-y:auto;font-size:13px;line-height:2.05;letter-spacing:1px;color:#c9b2a2;
 width:min(620px,100%);margin:0 auto;background:rgba(20,10,9,.5);border:1px solid rgba(150,60,50,.35);padding:20px;margin-bottom:14px}
#extAgree{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px;color:#d5c0b0;font-size:14px;letter-spacing:1px}
#extAgree input{width:18px;height:18px;accent-color:#b04a3a}
#extBtns{display:flex;gap:14px;justify-content:center}
/* markdown 通用样式 */
.md h3{font-size:15px;letter-spacing:3px;color:#e0a090;margin:14px 0 6px;font-weight:400}
.md h4{font-size:14px;letter-spacing:2px;color:#d0a898;margin:12px 0 4px;font-weight:400}
.md p{margin:6px 0;color:#cbb4a4}
.md ul{margin:4px 0 8px;padding-left:20px}
.md li{margin:3px 0}
.md b{color:#e6c8b8;font-weight:600}
.md blockquote{margin:8px 0;padding:8px 14px;border-left:2px solid rgba(170,70,60,.5);background:rgba(30,14,12,.5);color:#c9ad9c;font-size:12.5px;line-height:1.9}
#toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(30,16,14,.9);
 border:1px solid rgba(170,70,60,.5);color:#e0c8b8;padding:8px 18px;font-size:13px;letter-spacing:2px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}
#toast.on{opacity:1}
#fogIcon{position:absolute;top:20px;right:22px;font-size:13px;letter-spacing:2px;color:#8a4a40;z-index:7;display:none}
body.blood #storyText,body.blood #endText{color:#cbb0a0}
/* 时间线 */
#timeline{position:absolute;z-index:8;background:rgba(12,8,7,.92);border:1px solid rgba(150,80,70,.35);
 overflow:auto;display:none;padding:12px 14px}
#timeline.on{display:block}
#timeline .tlTitle{font-size:12px;letter-spacing:3px;color:#b98a78;margin-bottom:8px}
#timeline .tlStep{font-size:12px;letter-spacing:1px;color:#c4b5a6;line-height:1.9;margin:2px 0}
#timeline .tlStep .tlIdx{color:#8a6a5a;margin-right:6px}
#timeline .tlStep .tlChosen{color:#e0c8b8}
#timeline .tlStep .tlUnchosen{color:#6d5f5f}
#timeline .tlBranch{color:#7a6a60;font-size:11px}
/* 时间线位置：下方横向滚动 / 侧边竖排 / 底部细线 */
/* bottom 统一抬到选项按钮区域上方（约 220px），避免时间线浮层压住选项按钮 */
#timeline.pos-bottom{left:20px;right:20px;bottom:220px;max-height:34vh;border-radius:8px}
#timeline.pos-side{left:12px;top:60px;bottom:220px;width:200px;border-radius:8px}
#timeline.pos-line{left:20px;right:20px;bottom:220px;padding:6px 12px;background:rgba(12,8,7,.55)}
#timeline.pos-line .tlTitle{display:inline;margin-right:10px}
#timeline.pos-line .tlStep{display:inline;margin:0 8px}
#timeline.pos-line .tlStep .tlUnchosen{display:none}
#btnTimeline{position:absolute;right:20px;bottom:14px;z-index:8;font-size:12px;letter-spacing:2px;color:#9a7a6a;
 background:rgba(20,12,10,.8);border:1px solid rgba(150,80,70,.4);padding:6px 14px;cursor:pointer;font-family:inherit;display:none}
#btnTimeline:hover{color:#e0c8b8}
@media(max-width:420px){h1{font-size:30px}.grid{grid-template-columns:repeat(4,1fr)}#storyText{font-size:15px}#timeline.pos-side{width:160px}}
</style>
</head>
<body>
<div id="app">
  <div id="bg" data-mode="door"></div>
  <div id="fog"></div>
  <div id="scan"></div>
  <div id="vign"></div>
  <div id="noise"></div>
  <div id="cross"></div>
  <div id="scare"></div>
  <div id="fogIcon" data-fog="1">雾 1</div>

  <!-- 首屏 -->
  <div id="intro">
    <svg width="240" height="130" viewBox="0 0 240 130">
      <text id="logoText" x="120" y="72" text-anchor="middle" font-family="KaiTi,STKaiti,serif" font-size="56" fill="none"
        stroke="#e8dccd" stroke-width="1.6" stroke-dasharray="300" stroke-dashoffset="300"
        style="animation:write 2.6s ease forwards;transform:skewX(-14deg);transform-box:fill-box;transform-origin:center">雾港</text>
      <style>@keyframes write{to{stroke-dashoffset:0}}</style>
    </svg>

  if(T.cur || !T.q.length) return;

var AC = null;
function ac(){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }catch(e){ return null; } }
function beep(f,d){ try{ var a=ac(); if(!a) return; var o=a.createOscillator(), g=a.createGain(); o.frequency.value=f; o.type='square'; g.gain.value=.012; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+d); }catch(e){} }
function tick(){ if(S.settings.sfx && S.settings.horror!=='mild') beep(1400, .006); }
function scream(intensity){
  if(S.settings.horror==='mild' || S.settings.noFx) return;
  try{
    var a = ac(); if(!a) return;
    var dur = intensity>=2 ? 0.85 : 0.5;
    var buf = a.createBuffer(1, Math.floor(a.sampleRate*dur), a.sampleRate);
    var data = buf.getChannelData(0);
    for(var i=0;i<data.length;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/data.length, 2);
    var src = a.createBufferSource(); src.buffer = buf;
    var g = a.createGain(); g.gain.value = intensity>=2 ? 0.45 : 0.28;
    var f = a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700; f.Q.value=0.7;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
    var o = a.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(700, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(1900, a.currentTime+dur*0.5);
    var g2 = a.createGain(); g2.gain.setValueAtTime(0.22, a.currentTime);
    g2.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
    o.connect(g2); g2.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}

function layerOn(id){ return document.getElementById(id).classList.contains('on'); }
function fogLevel(){ return Math.min(RUN.path.length + 1, 3); }
function horrorOn(){ return S.settings.horror !== 'mild'; }
function hellOn(){ return S.settings.horror === 'hell' || S.settings.horror === 'abyss'; }
function abyssOn(){ return S.settings.horror === 'abyss'; }
function applyVisual(){
  var b = document.getElementById('bg');
  b.setAttribute('data-mode', S.settings.bg || 'none');
  document.body.classList.toggle('deep', fogLevel()>=3 || layerOn('ending'));

var HORROR_T = null;
function horrorTick(){
  if(abyssOn()){
    if(GAME.active) return;
    if(layerOn('story') && RUN.ended) return;
    if(Math.random() < 0.32) jumpScare(1);
  } else if(S.settings.horror === 'hell'){

var PHANTOM_T = null;
function startPhantom(){
  if(PHANTOM_T){ clearInterval(PHANTOM_T); PHANTOM_T = null; }
  var mode = S.settings.phantomMode;
  if(mode === 'off' || !layerOn('menu')) return;
  var pro = mode === 'pro';
  var pool = pro ? PHANTOM_PRO : PHANTOM_NORMAL;
  var interval = pro ? 450 : 1000;
  spawnPhantom(pool, pro);
  PHANTOM_T = setInterval(function(){
    if(!layerOn('menu')){ clearInterval(PHANTOM_T); PHANTOM_T=null; return; }
    spawnPhantom(pool, pro);
  }, interval);

function spawnPhantom(pool, pro){
  var wrap = document.getElementById('menu');
  if(!wrap) return;
  var el = document.createElement('span');
  el.className = 'scatter';
  if(pro) el.style.fontSize = '19px', el.style.color = '#ff5a4a', el.style.textShadow = '0 0 10px rgba(255,60,40,.8)';
  el.textContent = pool[Math.floor(Math.random()*pool.length)];

  el.style.top = (Math.random()*(vh-60)) + 'px';

  el.style.setProperty('--dy', (Math.sin(ang)*dist - 26).toFixed(1) + 'px');
  wrap.appendChild(el);
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, pro ? 2000 : 2700);
}

/* ================= 剧情 ================= */
function startGame(){
  incPlays();
  var plays = getPlays();
  RUN = { node: TREE.root, path: [], ended:false, horrorAtStart:S.settings.horror, variant: Math.max(0, plays - 1), timeline: [] };
  markPlayed();
  layer('story');
  renderNode(TREE.root);
  applyVisual();
  startHorrorTick();
  hideTimeline();
}
function isLeafNode(n){ return n.choices.every(function(c){ return c.to.charAt(0)==='E' || c.to.charAt(0)==='S'; }); }
function renderNode(id){
  var n = TREE.nodes[id];
  if(!n) return;
  var box = document.getElementById('storyText');
  var opts = document.getElementById('opts');
  box.innerHTML = ''; opts.innerHTML = '';
  var p = document.createElement('p'); box.appendChild(p);
  tAdd(p, pickText(id, n.text), function(){
    if(id === TREE.root){ markLastChar(p); }
    // 末层节点：随机触发小游戏（带「有人发现了你」随机事件感）
    if(isLeafNode(n) && Math.random() < gameTriggerChance()){
      discovered(n);
    } else {
      revealChoices(n);
    }
  });
  applyVisual();
  updateTimeline();
}
function gameTriggerChance(){
  var h = S.settings.horror;
  if(h === 'mild') return 0.06;
  if(h === 'normal') return 0.14;
  if(h === 'hell') return 0.22;
  return 0.30;
}
function discovered(n){
  var box = document.getElementById('storyText');
  var p2 = document.createElement('p');
  p2.style.color = '#c33'; p2.style.letterSpacing = '3px';
  box.appendChild(p2);
  tAdd(p2, '……有人发现了你！', function(){
    setTimeout(function(){ startMiniGame(n); }, 600);
  });
}

/* ================= 隐藏结局彩蛋：连点最后字 → 光标 → 打字 ================= */
var _secretCount = 0;
function markLastChar(p){
  var txt = p.textContent;
  if(!txt) return;
  var last = txt.slice(-1);
  p.innerHTML = '';
  p.appendChild(document.createTextNode(txt.slice(0, -1)));
  var s = document.createElement('span');
  s.className = 'lastChar';
  s.textContent = last;
  p.appendChild(s);
  s.addEventListener('click', function(ev){ ev.stopPropagation(); secretTap(); });
}
function secretTap(){
  _secretCount++;
  if(_secretCount < 5) return;
  _secretCount = 0;
  wakeCursor();
}
var SECRET_STATE = { active:false, idx:0, lines:0 };
function wakeCursor(){
  SECRET_STATE.active = true; SECRET_STATE.idx = 0; SECRET_STATE.lines = 0;
  var opts = document.getElementById('opts'); opts.innerHTML='';
  var box = document.getElementById('storyText');
  box.innerHTML='';
  var p = document.createElement('p'); p.className='secretHint'; p.textContent = '我似乎可以打点什么';
  box.appendChild(p);
  var cur = document.createElement('span'); cur.className='secretCur'; cur.id='secretCur'; cur.textContent='▏';
  box.appendChild(cur);
  document.addEventListener('keydown', onSecretKey);
}
function onSecretKey(e){
  if(!SECRET_STATE.active) return;
  if(e.key === 'Escape') return;
  e.preventDefault();
  if(e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter' || e.key === ' '){ addDoubtLine(); }
}
function addDoubtLine(){
  var box = document.getElementById('storyText');
  var cur = document.getElementById('secretCur');
  var line = document.createElement('p');
  line.className = 'doubtLine';
  line.textContent = HIDDEN_DOUBTS[SECRET_STATE.idx % HIDDEN_DOUBTS.length];
  SECRET_STATE.idx++; SECRET_STATE.lines++;
  box.insertBefore(line, cur);
  box.scrollTop = box.scrollHeight;
  if(SECRET_STATE.lines >= HIDDEN_DOUBTS.length){ finishSecret(); }
}
function finishSecret(){
  SECRET_STATE.active = false;
  document.removeEventListener('keydown', onSecretKey);
  document.getElementById('storyText').innerHTML='';
  document.getElementById('opts').innerHTML='';
  showEnding(HIDDEN1);
}

/* 隐藏结局 H2：惧渊临境模式下，连点标题 5 次触发「美丽的红门」 */
var _titleTap = 0, _titleTapT = null;
function titleTap(){
  if(!abyssOn()) return;
  _titleTap++;
  if(_titleTapT) clearTimeout(_titleTapT);
  _titleTapT = setTimeout(function(){ _titleTap = 0; }, 2000);
  if(_titleTap >= 5){
    _titleTap = 0;
    showEnding(HIDDEN2);
  }
}

function revealChoices(n){
  var opts = document.getElementById('opts');
  opts.innerHTML = '';
  var cs = visibleChoices(n);
  cs.forEach(function(c, i){
    var b = document.createElement('button'); b.className='opt';
    b.style.opacity='0'; b.style.transform='translateY(8px)';
    b.textContent = c.label;
    opts.appendChild(b);
    b.onclick = function(){ doChoice(c); };
    setTimeout(function(){
      b.style.transition='opacity .3s,transform .3s';
      b.style.opacity='1'; b.style.transform='translateY(0)';
    }, 80 + i*120);
  });
}
function doChoice(c){
  if(RUN.ended) return;
  // 记录时间线：当前节点 + 所有可见选项 + 已选
  var n = TREE.nodes[RUN.node];
  if(n){
    RUN.timeline.push({ nodeId: RUN.node, chosen: c.label, options: visibleChoices(n).map(function(o){ return o.label; }) });
  }
  RUN.path.push(c.label);
  if(c.to.charAt(0) === 'E' || c.to.charAt(0) === 'S'){ showEnding(c.to); }
  else { RUN.node = c.to; renderNode(c.to); }
}
function showEnding(eId){
  RUN.ended = true;
  if(HORROR_T){ clearInterval(HORROR_T); HORROR_T = null; }
  var e = TREE.endings[eId] || TREE.hidden[eId];
  if(!e){ return; }
  var isHidden = !!TREE.hidden[eId];
  var fresh = !S.endings[eId];
  if(fresh) S.endings[eId] = { at: Date.now() };
  writeSave();
  layer('ending');
  var no = document.getElementById('endNo'), path = document.getElementById('endPath'), box = document.getElementById('endText'), typeEl = document.getElementById('endType');
  no.innerHTML=''; path.innerHTML=''; box.innerHTML=''; typeEl.innerHTML='';
  var got = Object.keys(S.endings).length;
  var num = isHidden ? '结局 ？？？' : (eId.charAt(0)==='S' ? ('旁支 ' + prettyId(eId)) : ('结局 ' + prettyId(eId)));
  tAdd(no, '—— ' + num + '：' + e.name + '　·　已收集 ' + got + ' / ', function(){
    var tn=document.createElement('span'); tn.className='totalNum'; tn.textContent = totalNow();
    no.appendChild(tn);
  });
  // 类型标签
  if(e.type){
    var tc = document.createElement('span');
    tc.textContent = '【' + e.type + ' · ' + (TYPE_LABEL[e.type]||'') + '】';
    tc.style.color = TYPE_COLOR[e.type] || '#e0c8b8';
    tc.style.textShadow = '0 0 6px ' + (TYPE_COLOR[e.type]||'#e0c8b8');
    typeEl.appendChild(tc);
  }
  path.textContent = isHidden ? '你的路径：路径是什么啊……' : ('你的路径：' + RUN.path.join(' → '));
  setTimeout(function(){ tAdd(box, e.text); }, 400);
  var hor = document.getElementById('endHorror');
  hor.textContent = '本局恐怖模式：' + HORROR_LABEL[RUN.horrorAtStart] + (e.side ? '　·　旁支结局' : '');
  var ask = document.getElementById('endAsk'); ask.textContent = '';
  if(RUN.horrorAtStart === 'abyss'){
    setTimeout(function(){ tAdd(ask, '你还好吗？'); }, 1800);
  }
  if(fresh) toast(isHidden ? '隐藏结局已解锁。' : '解锁了新结局。');
  applyVisual();
  hideTimeline();
}

/* ================= 小游戏（8 种，运行时随机） ================= */
var GAME = { active:false, node:null, type:null, timer:null, timer2:null, timer3:null, count:0, target:0, pos:0, state:'', start:0, window:0, min:0, max:0 };
var GAME_TYPES = ['mash','timing','react','dodge','memory','hold','catch','stead'];
var GAME_META = {
  mash:   { title:'快逃！', hint:'时间结束前，猛点屏幕，甩掉它' },
  timing: { title:'屏息凝神', hint:'等指针落进亮色区间，立刻行动' },
  react:  { title:'别和它对视', hint:'它出现的一瞬间，立刻点「闭眼」' },
  dodge:  { title:'躲开它', hint:'只点绿色的安全点，别碰红色的' },
  memory: { title:'记住那张脸', hint:'记住闪过的牌，找出不同的那一张' },
  hold:   { title:'稳住呼吸', hint:'按住不放，让指针停在亮色区间里' },
  catch:  { title:'抓住它', hint:'看准移动的光点，点中它' },
  stead:  { title:'稳住自己', hint:'画面颤抖，在它停止的那一刻点击' }
};
function startMiniGame(node){
  GAME.active = true; GAME.node = node;
  GAME.type = GAME_TYPES[Math.floor(Math.random()*GAME_TYPES.length)];
  var meta = GAME_META[GAME.type];
  var panel = document.getElementById('miniGame');
  document.getElementById('mgTitle').textContent = meta.title;
  document.getElementById('mgHint').textContent = meta.hint;
  // 重置所有子区域
  ['mgBar','mgArea','mgBoard','mgCards'].forEach(function(id){ var el=document.getElementById(id); el.style.display='none'; el.innerHTML=''; });
  document.getElementById('mgTap').style.display='none';
  document.getElementById('mgTap').onclick=null;
  panel.classList.add('on');
  var init = { mash:initMash, timing:initTiming, react:initReact, dodge:initDodge, memory:initMemory, hold:initHold, catch:initCatch, stead:initStead };
  init[GAME.type](node);
}
function clearGame(){
  if(GAME.timer){ clearInterval(GAME.timer); GAME.timer = null; }
  if(GAME.timer2){ clearInterval(GAME.timer2); GAME.timer2 = null; }
  if(GAME.timer3){ clearInterval(GAME.timer3); GAME.timer3 = null; }
  GAME.active = false;
  document.getElementById('miniGame').classList.remove('on');
  document.getElementById('mgArea').onclick = null;
  document.getElementById('mgBoard').onclick = null;
}
function endMiniGame(success){
  var n = GAME.node;
  var cs = visibleChoices(n);
  var idx = success ? 0 : 1;
  if(cs[idx]) RUN.path.push(cs[idx].label);
  clearGame();
  if(!success && horrorOn()) jumpScare(2);
  // 走该节点第 idx 个选项的结局
  if(cs[idx]) showEnding(cs[idx].to);
  else showEnding(cs[0].to);
}
function initMash(g){
  GAME.count = 0; GAME.target = 26; GAME.total = 3600;
  var area = document.getElementById('mgArea'); area.style.display='flex';
  area.innerHTML = '<div>猛点这里！</div><div class="mgText" id="mgNum">0 / ' + GAME.target + '</div>';
  area.onclick = function(ev){ ev.stopPropagation(); GAME.count++; document.getElementById('mgNum').textContent = GAME.count + ' / ' + GAME.target; updateMashBar(); if(GAME.count >= GAME.target){ endMiniGame(true); } };
  var bar = document.getElementById('mgBar'); bar.style.display='block'; bar.innerHTML='<div id="mgBarFill"></div>';
  var start = Date.now();

    var el = Date.now() - start;

function updateMashBar(r){ var f = document.getElementById('mgBarFill'); if(f) f.style.width = Math.min(100, r*100) + '%'; }
function initTiming(g){
  GAME.pos = 0; GAME.min = 52; GAME.max = 70;

function initDodge(g){

    d.style.top = (10 + Math.random()*60) + '%';

function initMemory(g){
  GAME.count = 0; GAME.target = 3; GAME.state = 'round';
  var cards = document.getElementById('mgCards'); cards.style.display='grid';
  cards.innerHTML='';
  var cells = [];
  for(var i=0;i<4;i++){

/* ================= markdown 渲染 ================= */
function md(src){
  var lines = String(src||'').split('\n');
  var out = [], list = null;
  function closeList(){ if(list){ out.push('</'+list+'>'); list=null; } }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
  for (var i=0;i<lines.length;i++){
    var t = lines[i].trim();
    if (t === ''){ closeList(); continue; }
    if (/^###\s/.test(t)){ closeList(); out.push('<h4>'+inline(t.slice(4))+'</h4>'); }
    else if (/^##\s/.test(t)){ closeList(); out.push('<h3>'+inline(t.slice(3))+'</h3>'); }
    else if (/^#\s/.test(t)){ closeList(); out.push('<h3>'+inline(t.slice(2))+'</h3>'); }
    else if (/^-\s/.test(t)){ if(list!=='ul'){ closeList(); out.push('<ul>'); list='ul'; } out.push('<li>'+inline(t.slice(2))+'</li>'); }
    else if (/^>\s/.test(t)){ closeList(); out.push('<blockquote>'+inline(t.slice(2))+'</blockquote>'); }
    else { closeList(); out.push('<p>'+inline(t)+'</p>'); }
  }
  closeList();
  return out.join('');
}

function toggleFullscreen(){
  if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen().catch(function(){}); }
  else { var el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){ toast('浏览器拒绝了全屏请求，可按 F11 手动全屏'); }); }
}
function tryFullscreen(){
  if(!document.fullscreenElement){ var el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }
}

/* ================= 关于 ================= */
function showAbout(){
  layer('aboutLayer');
  var el=document.getElementById('aboutBox'); el.innerHTML='';
  ABOUT_ROWS.forEach(function(r){
    var d=document.createElement('div'); d.className='arow';
    var k=document.createElement('div'); k.className='ak'; k.textContent=r[0];
    var v=document.createElement('div'); v.className='av'; v.textContent=r[1];
    d.appendChild(k); d.appendChild(v); el.appendChild(d);
  });
  ABOUT_SECTIONS.forEach(function(s){
    var h=document.createElement('div'); h.className='sec'; h.textContent=s[0];
    var p=document.createElement('p'); p.textContent=s[1]; p.style.margin='2px 0 8px';
    el.appendChild(h); el.appendChild(p);
  });
}
function openPause(){ if(!layerOn('story') || RUN.ended) return; document.getElementById('pause').classList.add('on'); }
function closePause(){ document.getElementById('pause').classList.remove('on'); }
function exitToMenu(){ document.getElementById('pause').classList.remove('on'); tClear(); clearGame(); hideTimeline(); showMenu(); }

/* ================= 事件 ================= */
function tap(id, fn){ document.getElementById(id).addEventListener('click', function(ev){ ev.stopPropagation(); if(GAME.active) return; if(T.cur||T.hold){ skipType(); return; } fn(); }); }
tap('btnStart', function(){ startGame(); });
tap('btnGallery', function(){ layer('gallery'); buildGallery(); });
tap('galBack', function(){ layer('menu'); refreshMenu(); });
tap('btnSet', function(){ layer('setLayer'); buildSettings(); });
tap('setBack', function(){ layer('menu'); refreshMenu(); });
tap('setFull', toggleFullscreen);
tap('setReload', function(){ location.reload(); });
tap('setClear', clearSave);
tap('footAbout', showAbout);
tap('footFull', toggleFullscreen);
tap('aboutBack', function(){ layer('menu'); refreshMenu(); });
tap('endHome', function(){ layer('menu'); refreshMenu(); });
tap('endGal', function(){ layer('gallery'); buildGallery(); });
tap('modalClose', function(){ document.getElementById('modal').classList.remove('on'); });
tap('pauseResume', closePause);
tap('pauseExit', exitToMenu);
tap('discSet', function(){ document.getElementById('disclaimer').classList.remove('on'); markSeen(); layer('setLayer'); buildSettings(); });
tap('discStart', function(){ document.getElementById('disclaimer').classList.remove('on'); markSeen(); showMenu(); });
tap('extCancel', closeExtreme);
tap('extConfirm', confirmAbyss);
tap('btnTimeline', toggleTimeline);

// 标题连点触发 H2（惧渊临境）
document.getElementById('titleWrap').addEventListener('click', function(ev){ ev.stopPropagation(); if(GAME.active) return; if(T.cur||T.hold){ skipType(); return; } titleTap(); });

document.getElementById('extScroll').addEventListener('scroll', function(){
  var el = this;
  var atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
  if(atBottom) document.getElementById('extAgree').style.opacity = '1';
});
document.getElementById('extCheck').addEventListener('change', function(){
  document.getElementById('extConfirm').disabled = !this.checked;
});

document.addEventListener('click', function(e){
  if(GAME.active) return;
  var t=e.target;
  if(t.tagName==='BUTTON'||t.tagName==='INPUT'||t.tagName==='SELECT'||t.closest('.cell')||t.closest('.galTab')||t.closest('#titleWrap')) return;
  if(T.cur||T.hold) skipType();
});
document.addEventListener('keydown', function(e){
  if(e.key===' '||e.key==='Enter'){ var tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') return; if(GAME.active) return; e.preventDefault(); skipType(); }
  if(e.key==='Escape'){ if(document.getElementById('extreme').classList.contains('on')){ closeExtreme(); return; } if(document.getElementById('pause').classList.contains('on')) closePause(); else openPause(); }
});

/* ================= 启动 ================= */
loadSave(); applySettings(); applyVisual(); showMenu(); checkDisclaimer(); startHorrorTick();
(function(){
  var intro=document.getElementById('intro'), done=false;
  function enter(){ if(done) return; done=true; intro.classList.add('off'); flashFace(); }
  intro.addEventListener('click', enter);
  setTimeout(function(){
    var t = document.getElementById('logoText');
    if(t) t.style.fill = '#e8dccd';
  }, 2600);
  setTimeout(function(){ var s=document.getElementById('introSub'); if(s) s.classList.add('on'); }, 3400);
  setTimeout(enter, 5200);
})();
</script>
